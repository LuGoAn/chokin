name: chokin
description: "Chokin — Gestão Financeira Pessoal Offline Contínua"
publish_to: 'none'
version: 1.1.2+6

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  uuid: ^4.5.1
  path: ^1.9.0
  path_provider: 2.1.2
  fl_chart: 0.68.0
  shared_preferences: 2.2.2
  sqflite: ^2.4.1
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.4.4

dependency_overrides:
  path_provider_foundation: 2.3.2

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/OFL-ShipporiMincho.txt
    - assets/fonts/OFL-ZenKakuGothicNew.txt

  # Fontes do visual Sumi, cortadas para latim + os kanji usados (licença SIL OFL)
  fonts:
    - family: ZenKakuGothicNew
      fonts:
        - asset: assets/fonts/ZenKakuGothicNew-Regular.ttf
        - asset: assets/fonts/ZenKakuGothicNew-Medium.ttf
          weight: 500
        - asset: assets/fonts/ZenKakuGothicNew-Bold.ttf
          weight: 700
    - family: ShipporiMincho
      fonts:
        - asset: assets/fonts/ShipporiMincho-Medium.ttf
          weight: 500
        - asset: assets/fonts/ShipporiMincho-Bold.ttf
          weight: 700
